name: Deploy lunch battle to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare static site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set the SUPABASE_URL repository variable and SUPABASE_PUBLISHABLE_KEY repository secret."
            exit 1
          fi

          mkdir dist
          cp index.html dist/index.html
          node -e '
            const fs = require("node:fs");
            const url = process.env.SUPABASE_URL;
            const publishableKey = process.env.SUPABASE_PUBLISHABLE_KEY;
            if (!url.startsWith("https://") || !publishableKey.startsWith("sb_publishable_")) {
              throw new Error("Supabase URL or publishable key has an unexpected format.");
            }
            const config = `window.LUNCH_BATTLE_SUPABASE = ${JSON.stringify({ url, publishableKey })};\n`;
            fs.writeFileSync("dist/supabase-config.js", config);
          '

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
